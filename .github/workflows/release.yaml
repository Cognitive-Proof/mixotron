name: "Release"

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  ci:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      # Match the npm version pinned in package.json's "packageManager"
      # rather than Node 20's older bundled npm.
      - run: npm install -g npm@11.12.1
      - run: npm ci
      - run: npm run typecheck
        env:
          SKIP_ENV_VALIDATION: 1
      - run: npm run check
        env:
          SKIP_ENV_VALIDATION: 1

  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: "access_token"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build Docker image
        run: docker build -t ${{ vars.NAME }}:latest .
      - name: Push image to Artifact Registry
        run: |
          docker image tag ${{ vars.NAME }}:latest ${{ vars.DOCKER_LOCATION }}/${{ vars.NAME }}:${{ github.sha }}
          docker image tag ${{ vars.NAME }}:latest ${{ vars.DOCKER_LOCATION }}/${{ vars.NAME }}:latest
          docker push ${{ vars.DOCKER_LOCATION }}/${{ vars.NAME }}:${{ github.sha }}
          docker push ${{ vars.DOCKER_LOCATION }}/${{ vars.NAME }}:latest
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Deploy on Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.NAME }}
          image: ${{ vars.DOCKER_LOCATION }}/${{ vars.NAME }}:${{ github.sha }}
          region: ${{ vars.REGION }}
